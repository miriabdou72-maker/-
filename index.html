<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العصر العباسي التفاعلية</title>
    <!-- Tailwind CSS للتصميم السريع والأنيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold text-amber-400">منصة العصر العباسي</h1>
        <p class="text-sm text-slate-400 mt-1">منصة إلكترونية تفاعلية لنشر الأبحاث والمقالات التاريخية</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto p-4 max-w-3xl flex-grow">
        
        <!-- زر الدخول للوحة التحكم -->
        <div class="flex justify-between items-center mb-6 bg-slate-800 p-3 rounded-lg border border-slate-700">
            <span class="text-sm text-slate-300">هل أنت أستاذ معتمد؟</span>
            <button onclick="toggleAdminPanel()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-1.5 rounded text-sm transition">
                بوابة الأساتذة
            </button>
        </div>

        <!-- لوحة التحكم المحمية بكود السري -->
        <div id="adminPanel" class="hidden bg-slate-800 p-4 rounded-xl border border-amber-500/50 mb-6 shadow-xl">
            <h2 class="text-lg font-bold text-amber-400 mb-3">لوحة نشر الأساتذة</h2>
            <div id="loginSection">
                <p class="text-xs text-slate-400 mb-2">أدخل كود الصلاحية الخاص بالأساتذة للنشر:</p>
                <div class="flex gap-2">
                    <input type="password" id="adminCode" placeholder="كود الصلاحية..." class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm w-full focus:outline-none focus:border-amber-500 text-white">
                    <button onclick="verifyCode()" class="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded text-sm text-white">دخول</button>
                </div>
                <p id="loginError" class="text-red-400 text-xs mt-2 hidden">الكود غير صحيح!</p>
            </div>

            <!-- نموذج النشر (يظهر بعد نجاح تسجيل الدخول) -->
            <div id="publishForm" class="hidden space-y-3 mt-3">
                <input type="text" id="postTitle" placeholder="عنوان المقال أو الموضوع..." class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500 text-white">
                <textarea id="postContent" rows="3" placeholder="اكتب المحتوى هنا..." class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500 text-white"></textarea>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">رابط الصورة (اختياري):</label>
                    <input type="url" id="postImage" placeholder="https://example.com/image.jpg" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm w-full focus:outline-none focus:border-amber-500 text-white">
                </div>
                <button onclick="publishPost()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded text-sm transition">نشر فوراً للجميع</button>
            </div>
        </div>

        <!-- قسم عرض المنشورات للزوار -->
        <section>
            <h2 class="text-xl font-bold mb-4 border-b border-slate-800 pb-2 text-amber-400">أحدث المنشورات التاريخية</h2>
            <div id="postsContainer" class="space-y-4">
                <p class="text-slate-500 text-center py-6">جاري تحميل المنشورات من السحاب...</p>
            </div>
        </section>
    </main>

    <!-- الفوتر -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center p-4 text-xs text-slate-500">
        جميع الحقوق محفوظة &copy; 2026 - منصة العصر العباسي
    </footer>

    <!-- سكربتات Firebase وربط قاعدة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyD6mSK3BYoyicmQMsImx6bxs8ieWM_3dUM",
          authDomain: "hhhhhhhhhhhhhhh-d35de.firebaseapp.com",
          projectId: "hhhhhhhhhhhhhhh-d35de",
          storageBucket: "hhhhhhhhhhhhhhh-d35de.firebasestorage.app",
          messagingSenderId: "409423167146",
          appId: "1:409423167146:web:8636d1bfca219277b75ad3",
          measurementId: "G-V0T1CFDLQP"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // فتح وإغلاق لوحة التحكم
        window.toggleAdminPanel = function() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        // التحقق من كود الأستاذ
        window.verifyCode = function() {
            const code = document.getElementById('adminCode').value;
            const errorMsg = document.getElementById('loginError');
            if (code === "abbasid2026") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('publishForm').classList.remove('hidden');
                errorMsg.classList.add('hidden');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // نشر مقال أو صورة جديدة وحفظها في قاعدة بيانات Firebase السحابية
        window.publishPost = async function() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const imageUrl = document.getElementById('postImage').value.trim();

            if (!title || !content) {
                alert("الرجاء إدخال العنوان والمحتوى على الأقل!");
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    imageUrl: imageUrl,
                    createdAt: new Date()
                });

                // تفريغ الحقول بعد النشر الناجح
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postImage').value = '';
                alert("تم النشر بنجاح وأصبح مرئياً لجميع الزوار على الفور!");
                document.getElementById('adminPanel').classList.add('hidden');
            } catch (e) {
                console.error("خطأ أثناء النشر: ", e);
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
            }
        }

        // جلب وعرض المنشورات لحظياً (Real-time listener) لكل الزوار
        const q = query(collection(db, "posts"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<p class="text-slate-500 text-center py-6">لا توجد منشورات حتى الآن. كن أول من ينشر!</p>';
                return;
            }

            snapshot.forEach((doc) => {
                const post = doc.data();
                const postCard = document.createElement('div');
                postCard.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md";
                
                let imageHtml = post.imageUrl ? `<img src="${post.imageUrl}" alt="صورة المنشور" class="mt-3 rounded-lg max-h-60 w-full object-cover">` : '';

                postCard.innerHTML = `
                    <h3 class="text-lg font-bold text-amber-300 mb-2">${escapeHtml(post.title)}</h3>
                    <p class="text-slate-300 text-sm whitespace-pre-line leading-relaxed">${escapeHtml(post.content)}</p>
                    ${imageHtml}
                `;
                container.appendChild(postCard);
            });
        });

        // دالة أمان بسيطة لمنع حقن النصوص
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
